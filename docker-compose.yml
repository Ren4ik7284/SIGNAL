services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music-backend
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - RUST_LOG=info
      - JWT_SECRET=${JWT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks:
      - music-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - music-network

networks:
  music-network:
    driver: bridge
